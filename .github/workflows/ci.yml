name: CI & Quality Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Typecheck Desktop & App Packages
        run: npm run typecheck -w apps/desktop

      - name: Build Electron Desktop
        run: npm run build -w apps/desktop
