name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target Tag / Release version (e.g. v2.1.9). Leave empty to auto-detect.'
        required: false
        default: ''
      platform:
        description: 'Target platform to build and publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - android

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (Windows)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        shell: bash
        run: npm ci

      - name: Rebuild Native Modules
        working-directory: apps/desktop
        run: npm run rebuild

      - name: Build Desktop Application
        working-directory: apps/desktop
        run: |
          npm run build
          npx electron-builder --win --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml

  build-android:
    name: Build Android (Linux)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache ccache (Android Native C++)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-android-arm64-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-android-arm64-${{ hashFiles('package-lock.json') }}-
            ccache-android-arm64-

      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache -M 1G
          ccache -z

      - name: Install Dependencies
        run: npm ci

      - name: Decode Keystore
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/app/release.keystore
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret is empty. Falling back to default debug keystore."
          fi

      - name: Generate Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
          CCACHE_COMPRESS: 'true'
          CCACHE_MAXSIZE: 1G
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableUniversalApk=false \
            -PuseCcache=true \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease
          ccache -s

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  publish:
    name: Publish Release
    needs: [build-desktop, build-android]
    if: >-
      always() &&
      !cancelled() &&
      (needs.build-desktop.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package.json (for version fallback)
        if: github.event.inputs.tag == '' && github.ref_type != 'tag'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json

      - name: Download Desktop Artifacts
        if: needs.build-desktop.result == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-artifacts
          path: release-artifacts

      - name: Download Android Artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-artifacts
          path: release-artifacts

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="${{ github.ref_name }}"
            elif [ -f package.json ]; then
              TAG="v$(node -p "require('./package.json').version")"
            else
              echo "❌ Unable to determine release tag."
              exit 1
            fi
          fi
          echo "Processing release for tag: $TAG"
          
          # Inspect collected artifacts
          ls -la release-artifacts/
          
          FILES=()
          for f in release-artifacts/*; do
            if [ -f "$f" ]; then
              echo "✅ Found file: $f"
              FILES+=("$f")
            fi
          done
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "❌ No artifacts found to publish. Aborting."
            exit 1
          fi
          
          HAS_DESKTOP=false
          for f in release-artifacts/*.exe; do
            if [ -f "$f" ]; then
              HAS_DESKTOP=true
              break
            fi
          done

          HAS_APK=false
          for f in release-artifacts/*.apk; do
            if [ -f "$f" ]; then
              HAS_APK=true
              break
            fi
          done
          
          if [ "$HAS_DESKTOP" = true ] && [ "$HAS_APK" = true ]; then
            NOTES="Automated release of AutaKimi Monorepo (Windows & Android)."
          elif [ "$HAS_DESKTOP" = true ]; then
            NOTES="Automated release of AutaKimi Desktop (Windows)."
          else
            NOTES="Automated release of AutaKimi Mobile (Android)."
          fi

          if [ "${{ needs.build-desktop.result }}" = "failure" ]; then
            NOTES="$NOTES"$'\n'$'\n'"⚠️ **Windows Desktop build failed in this run.**"
          fi
          if [ "${{ needs.build-android.result }}" = "failure" ]; then
            NOTES="$NOTES"$'\n'$'\n'"⚠️ **Android APK build failed in this run.**"
          fi
          
          # Check if the release already exists
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "🚀 Release $TAG already exists. Uploading new/updated artifacts..."
            gh release upload "$TAG" "${FILES[@]}" --repo ${{ github.repository }} --clobber
          else
            echo "🚀 Creating new GitHub Release $TAG..."
            gh release create "$TAG" "${FILES[@]}" \
              --repo ${{ github.repository }} \
              --title "Release $TAG" \
              --notes "$NOTES" \
              --generate-notes
          fi
