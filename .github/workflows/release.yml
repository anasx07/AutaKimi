name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target Tag / Release version (e.g. v2.1.0)'
        required: false
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: bash
        run: npm ci

      - name: Rebuild Native Modules
        working-directory: apps/desktop
        run: npm run rebuild

      - name: Build Desktop Application
        working-directory: apps/desktop
        run: |
          npm run build
          npx electron-builder --win --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml

  build-android:
    name: Build Android (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Dependencies
        run: npm ci

      - name: Decode Keystore
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/app/release.keystore
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret is empty. Falling back to default debug keystore."
          fi

      - name: Generate Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  publish:
    name: Publish Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-artifacts
          path: release-artifacts

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-artifacts
          path: release-artifacts

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Processing release for tag: $TAG"
          
          # Inspect collected artifacts
          ls -la release-artifacts/
          
          FILES=()
          for f in release-artifacts/*; do
            if [ -f "$f" ]; then
              echo "✅ Found file: $f"
              FILES+=("$f")
            fi
          done
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "❌ No artifacts found to publish. Aborting."
            exit 1
          fi
          
          HAS_APK=false
          for f in release-artifacts/*.apk; do
            if [ -f "$f" ]; then
              HAS_APK=true
              break
            fi
          done
          
          NOTES="Automated release of AutaKimi Monorepo (Windows & Android)."
          if [ "$HAS_APK" = false ]; then
            NOTES="$NOTES"$'\n'$'\n'"⚠️ **Android APK is missing from this release.**"
          fi
          
          # Check if the release already exists
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "🚀 Release $TAG already exists. Uploading new/updated artifacts..."
            gh release upload "$TAG" "${FILES[@]}" --repo ${{ github.repository }} --clobber
          else
            echo "🚀 Creating new GitHub Release $TAG..."
            gh release create "$TAG" "${FILES[@]}" \
              --repo ${{ github.repository }} \
              --title "Release $TAG" \
              --notes "$NOTES" \
              --generate-notes
          fi
