name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Dependencies
        shell: bash
        run: npm ci

      - name: Rebuild Native Modules
        working-directory: apps/desktop
        run: npm run rebuild

      - name: Build Desktop Application
        working-directory: apps/desktop
        run: |
          npm run build
          npx electron-builder --win --publish never

      - name: Generate Mobile Android Project (Prebuild)
        id: mobile_prebuild
        continue-on-error: true
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Decode Keystore
        if: steps.mobile_prebuild.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/app/release.keystore
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret is empty. Skipping keystore decode."
          fi

      - name: Generate Android APK
        id: mobile_build
        if: steps.mobile_prebuild.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -d "apps/mobile/android" ]; then
            cd apps/mobile/android
            ./gradlew assembleRelease
          else
            echo "⚠️ Android folder not found, skipping compilation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release
        shell: bash
        run: |
          # 1. Gather Desktop Artifacts
          FILES=()
          for f in apps/desktop/dist/*.exe apps/desktop/dist/*.blockmap apps/desktop/dist/latest.yml; do
            if [ -f "$f" ]; then
              echo "✅ Found Desktop file: $f"
              FILES+=("$f")
            fi
          done
          
          # 2. Add Android APK if it exists
          ANDROID_APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          HAS_APK=false
          if [ -f "$ANDROID_APK_PATH" ]; then
            echo "✅ Found Android APK: $ANDROID_APK_PATH"
            FILES+=("$ANDROID_APK_PATH")
            HAS_APK=true
          else
            echo "⚠️ Android APK not found."
          fi
          
          # 3. Build release notes
          NOTES="Automated release of AutaKimi Monorepo (Windows & Android)."
          if [ "$HAS_APK" = false ]; then
            NOTES="$NOTES"$'\n'$'\n'"⚠️ **Android APK is missing from this release.** Build may have failed."
          fi
          
          # 4. Create Release
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "❌ No artifacts found at all. Aborting release."
            exit 1
          fi
          echo "🚀 Creating GitHub Release v${{ github.ref_name }}..."
          gh release create "${{ github.ref_name }}" "${FILES[@]}" \
            --repo ${{ github.repository }} \
            --target main \
            --title "Release ${{ github.ref_name }}" \
            --notes "$NOTES" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
